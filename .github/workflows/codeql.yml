name: CodeQL / Python
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Initialize Python CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
      - name: Analyze Python
        uses: github/codeql-action/analyze@v3
